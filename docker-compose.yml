services:
  postgres:
    image: postgres:16-alpine   # remplace par le tag de ton image locale si besoin (docker images)
    container_name: allvote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: allvote
      POSTGRES_USER: ${ALLVOTE_DB_USER:-allvote}
      POSTGRES_PASSWORD: ${ALLVOTE_DB_PASSWORD:?Definis ALLVOTE_DB_PASSWORD dans le fichier .env}
    ports:
      - "127.0.0.1:5434:5432"   # 5434 : 5432 et 5433 sont déjà pris sur ta machine
    volumes:
      - allvote-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ALLVOTE_DB_USER:-allvote} -d allvote"]
      interval: 5s
      retries: 10

volumes:
  allvote-data:
